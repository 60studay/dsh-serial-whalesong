<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Whalesong">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8fdc"/>
      <stop offset="1" stop-color="#1b5590"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="url(#plate)"/>

  <!-- 鲸尾：两片圆尾鳍，中间深 V（鱼的尾是竖的、鲸的是横的扁平两叶） -->
  <path fill="#f2f8ff"
        d="M21 29.5 C17.5 25.5 14 22 8.5 20.5
           C10 25.5 12 28.5 15 31
           C12 33.5 10 36.5 8.5 41.5
           C14 40 17.5 36.5 21 32.5 Z"/>

  <!-- 身体：圆头、背微拱 -->
  <path fill="#f2f8ff"
        d="M21 31
           C21 21.5 29.5 15 38.5 15
           C47.5 15 55 20.5 57 27
           C57 27.6 56.8 28.2 56.4 28.6
           C51 29.2 45.6 31.4 41 34.4
           C36.4 37.4 28.6 37.6 24 35.4
           C22 34.4 21 33 21 31 Z"/>

  <!-- 张开的嘴：从吻部切一个楔形缺口（露出底色 = 开口） -->
  <path fill="url(#plate)"
        d="M56.6 27.6 L44 28.2 L56.2 33.4 Z"/>

  <!-- 眼 -->
  <circle cx="42.5" cy="21.5" r="2.4" fill="url(#plate)"/>

  <!-- 胸鳍 -->
  <path fill="#f2f8ff"
        d="M30 34.5 C29 39.5 31 44 35.5 43.5 C35 39.5 34 36.5 33.5 34.5 Z"/>

  <!-- 声波 -->
  <g fill="none" stroke="#f2f8ff" stroke-width="3" stroke-linecap="round">
    <path d="M54.5 19.5 A 9 9 0 0 1 54.5 33.5"/>
    <path d="M58.5 14.5 A 15 15 0 0 1 58.5 38.5"/>
  </g>

  <!-- 串口信号线：方波 -->
  <path d="M9 52.5 H18 V45.5 H28 V52.5 H38 V45.5 H48 V52.5 H55"
        fill="none" stroke="#7fe3a4" stroke-width="3.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
